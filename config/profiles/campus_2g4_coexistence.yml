schema_version: "1.0"
profile_id: campus_2g4_coexistence
description: 2.4 GHz coexistence survey for Wi-Fi/BLE-like activity without payload decoding
enabled: true
schedule:
  mode: continuous
radio:
  center_frequency_hz: 2440000000
  sample_rate_sps: 20000000
  bandwidth_hz: 20000000
  gain_mode: manual
  gain_db: 28
capture:
  duration_ms: 500
  interval_ms: 1000
preprocessing:
  pipeline_version: rfgpt-compatible-v1
  fft_size: 512
  hop_size: 512
  window: blackman
  output_width_px: 512
  output_height_px: 512
  color_map: viridis
  include_axes: false
  db_min: null
  db_max: null
retention:
  upload_spectrogram: true
  upload_iq: triggered
  local_iq_ring_seconds: 60
