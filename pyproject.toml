[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-platform"
version = "0.1.0"
description = "Local RF intelligence platform simulated vertical slice"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "nats-py>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  "structlog>=24.1",
  "tenacity>=8.3",
  "psutil>=6.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "pillow>=10.3",
  "matplotlib>=3.8",
  "gradio>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
rf-api = "rf_platform.backend.main:cli"
rf-sensor = "rf_platform.sensor_agent.main:cli"
rf-worker = "rf_platform.worker.main:cli"
rf-dashboard = "rf_platform.dashboard.main:cli"
rf-ask-rf = "rf_platform.ask_rf.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:multipart.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = false
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["rf_platform"]
